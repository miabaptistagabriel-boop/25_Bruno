<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Descobre a tua Equipa!</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin-top: 80px; background-color: #f0f2f5; transition: background-color 0.5s ease; }
        .card { padding: 40px; border-radius: 15px; display: inline-block; background: white; box-shadow: 0 8px 16px rgba(0,0,0,0.1); width: 350px; }
        input { padding: 12px; font-size: 16px; width: 80%; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; text-align: center; outline: none; }
        input:focus { border-color: #4f46e5; }
        button { padding: 12px 20px; font-size: 16px; cursor: pointer; background: #4f46e5; color: white; border: none; border-radius: 5px; width: 85%; font-weight: bold; }
        button:hover { background: #4338ca; }
        #resultado { margin-top: 25px; font-size: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Qual é a minha Equipa?</h2>
        <p>Escreve o teu primeiro nome:</p>
        <input type="text" id="nomeInput" placeholder="Ex: Bruno" autofocus>
        <br>
        <button id="btnVer">Ver a minha Cor</button>
        <div id="resultado"></div>
    </div>

    <script>
        // Função para retirar acentos e letras maiúsculas e comparar perfeitamente
        function normalizar(texto) {
            return texto.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
        }

        const listaEquipas = {
            "camila": { nome: "Verde", codigo: "#22c55e" },
            "bia": { nome: "Amarelo", codigo: "#eab308" },
            "bruno": { nome: "Verde", codigo: "#22c55e" },
            "andre": { nome: "Azul", codigo: "#3b82f6" },
            "maria": { nome: "Vermelho", codigo: "#ef4444" }
        };

        function consultarEquipa() {
            const inputElement = document.getElementById("nomeInput");
            const valorDigitado = normalizar(inputElement.value);
            const res = document.getElementById("resultado");

            if (valorDigitado === "") {
                res.innerHTML = "<span style='color: #6b7280;'>Por favor, escreve um nome.</span>";
                document.body.style.backgroundColor = "#f0f2f5";
                return;
            }

            if (listaEquipas[valorDigitado]) {
                const equipa = listaEquipas[valorDigitado];
                const nomeFormatado = inputElement.value.trim();
                const nomeBonito = nomeFormatado.charAt(0).toUpperCase() + nomeFormatado.slice(1);
                
                res.innerHTML = `Olá, <b>${nomeBonito}</b>!<br>A tua equipa é: <br><span style="color: ${equipa.codigo}; font-size: 26px; font-weight: bold; text-transform: uppercase;">${equipa.nome}</span>`;
                document.body.style.backgroundColor = equipa.codigo + "22";
            } else {
                res.innerHTML = "<span style='color: #ef4444;'>Nome não encontrado! Confirma se escreveste bem (Camila, Bia, Bruno, Andre, Maria).</span>";
                document.body.style.backgroundColor = "#f0f2f5";
            }
        }

        document.getElementById("btnVer").addEventListener("click", consultarEquipa);
        document.getElementById("nomeInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                consultarEquipa();
            }
        });
    </script>
</body>
</html>
